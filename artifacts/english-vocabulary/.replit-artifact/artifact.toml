kind = "web"
previewPath = "/"
title = "English Vocabulary – Grade 9"
description = "A complete English vocabulary learning website for Grade 9 students in Oman, with Arabic meanings, unit-based lessons, live bilingual search, and spoken pronunciation."
version = "1.0.0"
id = "artifacts/english-vocabulary"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20615

[services.development]
run = "pnpm --filter @workspace/english-vocabulary run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/english-vocabulary", "run", "build" ]
serve = "static"
publicDir = "artifacts/english-vocabulary/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20615"
BASE_PATH = "/"
